name: 'nanos-world Lua Linter'
description: 'Fast, accurate linter and type-checker for nanos world Lua scripts powered by LuaLS'
author: 'nanos-world'
branding:
  icon: 'check-circle'
  color: 'yellow'

inputs:
  path:
    description: 'Path to workspace directory or Lua file to check'
    required: false
    default: '.'
  checklevel:
    description: 'Minimum diagnostic severity level to report (Error, Warning, Information, Hint)'
    required: false
    default: 'Warning'
  config:
    description: 'Path to a custom .luarc.json configuration file'
    required: false
    default: ''
  annotations:
    description: 'Path to a custom annotations.lua file'
    required: false
    default: ''
  luals-version:
    description: 'Version of LuaLS to use (or "latest")'
    required: false
    default: 'latest'
  fail-on-error:
    description: 'Whether to fail the action step if diagnostic errors/warnings are found'
    required: false
    default: 'true'
  quiet:
    description: 'Suppress progress output'
    required: false
    default: 'false'
  ignore:
    description: 'Files or directories to ignore (supports glob patterns, multiple entries can be newline or comma separated)'
    required: false
    default: ''
  cache:
    description: 'Whether to cache the LuaLS binary and annotations across workflow runs'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    # The ISO week refreshes the cache entry (a static key would never be saved
    # again); restore-keys fall back to previous weeks. Cheap: one `date` call.
    - name: Compute cache week
      id: cacheweek
      shell: bash
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    - name: Cache LuaLS binary and annotations
      if: ${{ inputs.cache != 'false' }}
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/nanos-lint
          ~/AppData/Local/nanos-lint
          ~/Library/Caches/nanos-lint
        key: nanos-lint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.luals-version }}-${{ steps.cacheweek.outputs.week }}
        restore-keys: |
          nanos-lint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.luals-version }}-
          nanos-lint-${{ runner.os }}-${{ runner.arch }}-

    - name: Run nanos-lint
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CHECKLEVEL: ${{ inputs.checklevel }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_LUALS_VERSION: ${{ inputs.luals-version }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_QUIET: ${{ inputs.quiet }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        ARGS=("check" "$INPUT_PATH" "--checklevel=$INPUT_CHECKLEVEL" "--luals-version=$INPUT_LUALS_VERSION" "--format=github")

        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=("--config=$INPUT_CONFIG")
        fi

        if [ -n "$INPUT_ANNOTATIONS" ]; then
          ARGS+=("--annotations=$INPUT_ANNOTATIONS")
        fi

        if [ -n "$INPUT_IGNORE" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            trimmed=$(echo "$line" | xargs)
            if [ -n "$trimmed" ]; then
              ARGS+=("--ignore=$trimmed")
            fi
          done <<< "$INPUT_IGNORE"
        fi

        if [ "$INPUT_FAIL_ON_ERROR" = "false" ]; then
          ARGS+=("--no-fail")
        fi

        if [ "$INPUT_QUIET" = "true" ]; then
          ARGS+=("--quiet")
        fi

        # dist/ is gitignored, so `uses: vugi99/nanos-lint@<ref>` consumers always
        # take the npx branch; the first one is for local `uses: ./` checkouts.
        if [ -f "$ACTION_PATH/dist/cli.js" ]; then
          node "$ACTION_PATH/dist/cli.js" "${ARGS[@]}"
        else
          # Exact version: a range could run a different release than the pinned
          # tag. Bump together with "version" in package.json.
          npx --yes nanos-lint@2.7.0 "${ARGS[@]}"
        fi
