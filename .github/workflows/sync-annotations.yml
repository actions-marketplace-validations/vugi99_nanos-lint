name: Sync Annotations

on:
  schedule:
    - cron: '0 1 * * *' # Every day at 01:00 UTC (1h after upstream docgen schedule)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Update Upstream Annotations Submodule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update submodule
        run: git submodule update --remote --merge

      - name: Run verification tests
        run: |
          npm run typecheck
          npm test

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: update nanos world annotations submodule'
          title: 'chore: update nanos world annotations submodule'
          body: |
            Automated synchronization of submodule `vendor/nanos-world-vscode-extension` from upstream `docgen-output` branch.

            - Synced upstream submodule changes.
            - Verified against TypeScript typecheck and Vitest test suite.
          branch: 'chore/sync-annotations'
          delete-branch: true
