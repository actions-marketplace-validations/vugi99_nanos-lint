name: Sync Annotations

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:

jobs:
  sync:
    name: Sync & Patch Upstream Annotations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update submodule
        run: git submodule update --remote --merge

      - name: Sync and sanitize annotations
        run: npm run sync-annotations

      - name: Run verification tests
        run: |
          npm run typecheck
          npm test

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: update and patch nanos world annotations'
          title: 'chore: update and patch nanos world annotations'
          body: |
            Automated synchronization from upstream `nanos-world/vscode-extension` (`docgen-output` branch).
            
            - Synced upstream changes.
            - Sanitized Issue #20 multi-line parameter tables.
            - Verified against Vitest test suite.
          branch: 'chore/sync-annotations'
          delete-branch: true

