name: Release

on:
  workflow_run:
    workflows: ["CI"]
    # No `branches:` filter: it matches the triggering run's branch, and a tag push
    # reports the tag name, so tag-triggered CI would be dropped.
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. v1.1.0)"
        required: false
        default: ""

# One release at a time per commit, so duplicate runs cannot race each other.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    # CI runs for master/main pushes, tag pushes and pull requests. Only the
    # tag-triggered run may release: a branch push of the same commit sees the tag
    # at HEAD too, which is what released every tag twice.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch != 'master' &&
        github.event.workflow_run.head_branch != 'main'
      )
    # contents: write for the release and floating tag; id-token stays with publish-npm.
    permissions:
      contents: write
    outputs:
      is_release: ${{ steps.tag.outputs.is_release }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect Release Tag
        id: tag
        env:
          # Via env (never interpolated into `run:` text): prevents command injection.
          TAG_INPUT: ${{ github.event.inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${TAG_INPUT}" ]; then
            TAG="$TAG_INPUT"
          else
            # End-anchored; `|| true` keeps "no tag" from failing under -e -o pipefail.
            TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          fi

          if [ -z "$TAG" ]; then
            echo "No release tag found on commit. Skipping release build."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same allow-list as the packaging step: the tag is interpolated into URLs
          # and archive file names there.
          case "$TAG" in
            ""|.|..|*[!0-9A-Za-z._-]*)
              echo "::error::Refusing to use unexpected release tag: '${TAG}'" >&2
              exit 1
              ;;
          esac

          # Idempotent: a re-pushed tag or a re-run must not build or publish again.
          if curl -fsS -o /dev/null \
               -H "Authorization: token ${GITHUB_TOKEN}" \
               "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"; then
            echo "Release ${TAG} already exists. Skipping release build."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found release tag: $TAG"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_release=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.tag.outputs.is_release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Fail before packaging: npm publish takes the version from package.json.
      - name: Verify tag matches package.json version
        if: steps.tag.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG_NAME' (version $TAG_VERSION) does not match package.json version '$PKG_VERSION'. Refusing to build or publish this release."
            exit 1
          fi
          echo "Release tag $TAG_NAME matches package.json version $PKG_VERSION."

      - name: Install dependencies
        if: steps.tag.outputs.is_release == 'true'
        run: npm ci

      - name: Build distribution package
        if: steps.tag.outputs.is_release == 'true'
        run: npm run build

      - name: Package standalone distributions with LuaLS binaries
        if: steps.tag.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          npx tsx scripts/package-release.ts --tag "$TAG_NAME"

      - name: Create GitHub Release
        if: steps.tag.outputs.is_release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          files: |
            release-builds/nanos-lint-*-windows-x64.zip
            release-builds/nanos-lint-*-linux-x64.tar.gz
            release-builds/nanos-lint-*-linux-arm64.tar.gz
            release-builds/nanos-lint-*-macos-arm64.tar.gz
            release-builds/nanos-lint-*-macos-x64.tar.gz
            release-builds/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update floating major version tag
        if: steps.tag.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAJOR=$(echo "$TAG_NAME" | grep -oE '^v?[0-9]+' || true)
          if [ -n "$MAJOR" ]; then
            echo "Updating floating major tag $MAJOR to point to $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "$MAJOR" -m "Release $TAG_NAME"
            git push origin "$MAJOR" --force
          fi

  # Own job so `id-token: write` (npm trusted publishing) is not granted to the
  # release job or its download steps. No NPM_TOKEN is used.
  publish-npm:
    name: Publish to npm
    needs: build-and-release
    runs-on: ubuntu-latest
    if: needs.build-and-release.outputs.is_release == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build distribution package
        run: npm run build

      # Version comes from package.json; the build job already validated the tag.
      - name: Publish to npm
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "nanos-lint@${VERSION}" version >/dev/null 2>&1; then
            echo "nanos-lint@${VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --access public
