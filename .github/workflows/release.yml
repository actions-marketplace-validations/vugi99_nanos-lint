name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master, main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect Release Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          fi

          if [ -z "$TAG" ]; then
            echo "No release tag found on commit. Skipping release build."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found release tag: $TAG"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_release=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.tag.outputs.is_release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.tag.outputs.is_release == 'true'
        run: npm ci

      - name: Build distribution package
        if: steps.tag.outputs.is_release == 'true'
        run: npm run build

      - name: Package standalone distributions with LuaLS binaries
        if: steps.tag.outputs.is_release == 'true'
        run: |
          LUALS_VERSION=$(node -e "
            fetch('https://api.github.com/repos/LuaLS/lua-language-server/releases/latest', {
              headers: { 'User-Agent': 'nanos-lint', 'Authorization': 'token ${{ secrets.GITHUB_TOKEN }}' }
            })
            .then(r => r.json())
            .then(d => {
              const tag = (d.tag_name || '3.19.1').replace(/^v/, '');
              console.log(tag);
            })
            .catch(() => console.log('3.19.1'));
          ")
          # The tag is an external API response: only accept a plain version token before it is
          # interpolated into shell commands, URLs and archive file names (command injection).
          case "$LUALS_VERSION" in
            ""|.|..|*[!0-9A-Za-z._-]*)
              echo "Refusing to use unexpected LuaLS version: '${LUALS_VERSION}'" >&2
              exit 1
              ;;
          esac
          echo "Using latest LuaLS release: ${LUALS_VERSION}"
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          case "$TAG_NAME" in
            ""|.|..|*[!0-9A-Za-z._-]*)
              echo "Refusing to use unexpected release tag: '${TAG_NAME}'" >&2
              exit 1
              ;;
          esac
          mkdir -p release-builds

          # Download latest annotations for offline bundle distribution
          curl -fsSL "https://raw.githubusercontent.com/nanos-world/vscode-extension/refs/heads/docgen-output/annotations.lua" -o annotations.lua
          if [ ! -s annotations.lua ] || [ $(wc -c < annotations.lua) -lt 1000 ]; then
            echo "Downloaded annotations.lua is missing or invalid" >&2
            exit 1
          fi

          # 1. Windows x64 Package
          mkdir -p pkg-windows/bin pkg-windows/templates pkg-windows/dist
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-win32-x64.zip" -o luals-win.zip
          unzip -q luals-win.zip -d pkg-windows-luals
          cp -r pkg-windows-luals/bin/* pkg-windows/bin/
          cp -r pkg-windows-luals/locale pkg-windows-luals/meta pkg-windows-luals/script pkg-windows-luals/main.lua pkg-windows/ 2>/dev/null || true
          cp -r dist/. pkg-windows/dist/
          cp annotations.lua pkg-windows/annotations.lua
          cp -r templates/. pkg-windows/templates/
          cp package.json README.md LICENSE pkg-windows/
          
          # Create Windows batch launcher
          cat << 'EOF' > pkg-windows/nanos-lint.cmd
          @echo off
          node "%~dp0dist\cli.js" %*
          exit /b %ERRORLEVEL%
          EOF

          # Verify Windows distribution entrypoint outputs help
          node pkg-windows/dist/cli.js --help > /dev/null

          (cd pkg-windows && zip -rq "../release-builds/nanos-lint-${TAG_NAME}-windows-x64.zip" .)

          # 2. Linux x64 Package
          mkdir -p pkg-linux/bin pkg-linux/templates pkg-linux/dist
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" -o luals-linux.tar.gz
          tar -xzf luals-linux.tar.gz -C pkg-linux-luals 2>/dev/null || (mkdir -p pkg-linux-luals && tar -xzf luals-linux.tar.gz -C pkg-linux-luals)
          cp -r pkg-linux-luals/bin/* pkg-linux/bin/
          cp -r pkg-linux-luals/locale pkg-linux-luals/meta pkg-linux-luals/script pkg-linux-luals/main.lua pkg-linux/ 2>/dev/null || true
          cp -r dist/. pkg-linux/dist/
          cp annotations.lua pkg-linux/annotations.lua
          cp -r templates/. pkg-linux/templates/
          cp package.json README.md LICENSE pkg-linux/

          # Create Linux shell launcher
          cat << 'EOF' > pkg-linux/nanos-lint
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec node "$DIR/dist/cli.js" "$@"
          EOF
          chmod +x pkg-linux/nanos-lint

          # Verify Linux distribution launcher
          ./pkg-linux/nanos-lint --help > /dev/null

          tar -czf "release-builds/nanos-lint-${TAG_NAME}-linux-x64.tar.gz" -C pkg-linux .

          # 3. Linux arm64 (aarch64) Package
          mkdir -p pkg-linux-arm64/bin pkg-linux-arm64/templates pkg-linux-arm64/dist
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-arm64.tar.gz" -o luals-linux-arm64.tar.gz
          tar -xzf luals-linux-arm64.tar.gz -C pkg-linux-arm64-luals 2>/dev/null || (mkdir -p pkg-linux-arm64-luals && tar -xzf luals-linux-arm64.tar.gz -C pkg-linux-arm64-luals)
          cp -r pkg-linux-arm64-luals/bin/* pkg-linux-arm64/bin/
          cp -r pkg-linux-arm64-luals/locale pkg-linux-arm64-luals/meta pkg-linux-arm64-luals/script pkg-linux-arm64-luals/main.lua pkg-linux-arm64/ 2>/dev/null || true
          cp -r dist/. pkg-linux-arm64/dist/
          cp annotations.lua pkg-linux-arm64/annotations.lua
          cp -r templates/. pkg-linux-arm64/templates/
          cp package.json README.md LICENSE pkg-linux-arm64/

          # Create Linux arm64 shell launcher
          cat << 'EOF' > pkg-linux-arm64/nanos-lint
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec node "$DIR/dist/cli.js" "$@"
          EOF
          chmod +x pkg-linux-arm64/nanos-lint

          # Verify Linux arm64 distribution launcher
          ./pkg-linux-arm64/nanos-lint --help > /dev/null

          tar -czf "release-builds/nanos-lint-${TAG_NAME}-linux-arm64.tar.gz" -C pkg-linux-arm64 .

          # 4. macOS arm64 (Apple Silicon) Package
          mkdir -p pkg-macos-arm64/bin pkg-macos-arm64/templates pkg-macos-arm64/dist
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-darwin-arm64.tar.gz" -o luals-macos-arm64.tar.gz
          tar -xzf luals-macos-arm64.tar.gz -C pkg-macos-arm64-luals 2>/dev/null || (mkdir -p pkg-macos-arm64-luals && tar -xzf luals-macos-arm64.tar.gz -C pkg-macos-arm64-luals)
          cp -r pkg-macos-arm64-luals/bin/* pkg-macos-arm64/bin/
          cp -r pkg-macos-arm64-luals/locale pkg-macos-arm64-luals/meta pkg-macos-arm64-luals/script pkg-macos-arm64-luals/main.lua pkg-macos-arm64/ 2>/dev/null || true
          cp -r dist/. pkg-macos-arm64/dist/
          cp annotations.lua pkg-macos-arm64/annotations.lua
          cp -r templates/. pkg-macos-arm64/templates/
          cp package.json README.md LICENSE pkg-macos-arm64/

          # Create macOS arm64 shell launcher
          cat << 'EOF' > pkg-macos-arm64/nanos-lint
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec node "$DIR/dist/cli.js" "$@"
          EOF
          chmod +x pkg-macos-arm64/nanos-lint

          # Verify macOS arm64 distribution launcher
          ./pkg-macos-arm64/nanos-lint --help > /dev/null

          tar -czf "release-builds/nanos-lint-${TAG_NAME}-macos-arm64.tar.gz" -C pkg-macos-arm64 .

          # 5. macOS x64 (Intel) Package
          mkdir -p pkg-macos-x64/bin pkg-macos-x64/templates pkg-macos-x64/dist
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-darwin-x64.tar.gz" -o luals-macos-x64.tar.gz
          tar -xzf luals-macos-x64.tar.gz -C pkg-macos-x64-luals 2>/dev/null || (mkdir -p pkg-macos-x64-luals && tar -xzf luals-macos-x64.tar.gz -C pkg-macos-x64-luals)
          cp -r pkg-macos-x64-luals/bin/* pkg-macos-x64/bin/
          cp -r pkg-macos-x64-luals/locale pkg-macos-x64-luals/meta pkg-macos-x64-luals/script pkg-macos-x64-luals/main.lua pkg-macos-x64/ 2>/dev/null || true
          cp -r dist/. pkg-macos-x64/dist/
          cp annotations.lua pkg-macos-x64/annotations.lua
          cp -r templates/. pkg-macos-x64/templates/
          cp package.json README.md LICENSE pkg-macos-x64/

          # Create macOS x64 shell launcher
          cat << 'EOF' > pkg-macos-x64/nanos-lint
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec node "$DIR/dist/cli.js" "$@"
          EOF
          chmod +x pkg-macos-x64/nanos-lint

          # Verify macOS x64 distribution launcher
          ./pkg-macos-x64/nanos-lint --help > /dev/null

          tar -czf "release-builds/nanos-lint-${TAG_NAME}-macos-x64.tar.gz" -C pkg-macos-x64 .

      - name: Create GitHub Release
        if: steps.tag.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          files: |
            release-builds/nanos-lint-*-windows-x64.zip
            release-builds/nanos-lint-*-linux-x64.tar.gz
            release-builds/nanos-lint-*-linux-arm64.tar.gz
            release-builds/nanos-lint-*-macos-arm64.tar.gz
            release-builds/nanos-lint-*-macos-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update floating major version tag
        if: steps.tag.outputs.is_release == 'true'
        run: |
          TAG="${{ steps.tag.outputs.tag_name }}"
          MAJOR=$(echo "$TAG" | grep -oE '^v?[0-9]+' || true)
          if [ -n "$MAJOR" ]; then
            echo "Updating floating major tag $MAJOR to point to $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "$MAJOR" -m "Release $TAG"
            git push origin "$MAJOR" --force
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.tag.outputs.is_release == 'true'
        run: npm publish --access public

