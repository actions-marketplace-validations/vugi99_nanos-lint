name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ master, main, dev ]

# Least privilege: this workflow only needs to read the repository. Declaring it
# explicitly keeps the token read-only even when the repository or organization
# default is read-write (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} - Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No 1-vCPU "ubuntu-slim": its 15-minute limit would block releases.
        os: [ ubuntu-latest, windows-latest, macos-latest, macos-26-intel, ubuntu-26.04-arm ]
        node: [ 24, 26 ]
    # Requires the live tests (one shared LuaLS download per run).
    env:
      NANOS_LIVE_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run project quality gates
        run: npm run gates

      - name: Test CLI directly on passing fixtures (via bin/nanos-lint.js and dist/cli.js)
        run: |
          node bin/nanos-lint.js check tests/pass
          node dist/cli.js check tests/pass
          node dist/cli.js --help
          node dist/cli.js -v

      - name: Test CLI directly on failing fixtures
        shell: bash
        run: |
          if node bin/nanos-lint.js check tests/fail/type_mismatch.lua; then
            echo "Expected tests/fail/type_mismatch.lua to fail via bin/nanos-lint.js, but it succeeded!"
            exit 1
          fi
          if node dist/cli.js check tests/fail/type_mismatch.lua; then
            echo "Expected tests/fail/type_mismatch.lua to fail via dist/cli.js, but it succeeded!"
            exit 1
          fi
          echo "Both bin/nanos-lint.js and dist/cli.js failed as expected on failing fixtures."
