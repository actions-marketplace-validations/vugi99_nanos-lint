name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ master, main ]

# Least privilege: this workflow only needs to read the repository. Declaring it
# explicitly keeps the token read-only even when the repository or organization
# default is read-write (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} - Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node: [ 24, 26 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Cache LuaLS binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nanos-lint
            ~/AppData/Local/nanos-lint
          key: luals-${{ runner.os }}-${{ hashFiles('src/luals.ts') }}
          restore-keys: |
            luals-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript code
        run: npm run lint

      - name: Typecheck TypeScript code
        run: npm run typecheck

      - name: Build distribution package
        run: npm run build

      - name: Run Vitest tests (Unit & LuaLS Integration)
        run: npm test

      - name: Test CLI directly on passing fixtures (via bin/nanos-lint.js and dist/cli.js)
        run: |
          node bin/nanos-lint.js check tests/pass
          node dist/cli.js check tests/pass
          node dist/cli.js --help
          node dist/cli.js -v

      - name: Test CLI directly on failing fixtures
        shell: bash
        run: |
          if node bin/nanos-lint.js check tests/fail/type_mismatch.lua; then
            echo "Expected tests/fail/type_mismatch.lua to fail via bin/nanos-lint.js, but it succeeded!"
            exit 1
          fi
          if node dist/cli.js check tests/fail/type_mismatch.lua; then
            echo "Expected tests/fail/type_mismatch.lua to fail via dist/cli.js, but it succeeded!"
            exit 1
          fi
          echo "Both bin/nanos-lint.js and dist/cli.js failed as expected on failing fixtures."

